<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>欧洲数字银行联合资产核验中心</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏦</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at 50% 20%, #15294a 0%, #071120 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: rgba(18, 32, 58, 0.82);
      border: 1px solid rgba(130, 180, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(16px);
      padding: 32px 24px;
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #ffffff 40%, #9fc3ea 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 26px;
    }
    .bank-tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .tag.bunq { color: #34d399; }
    .tag.wise { color: #38bdf8; }
    .tag.monzo { color: #fb923c; }
    .tag.revolut { color: #a78bfa; }
    
    .spinner-box {
      margin: 10px auto 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .status-text {
      font-size: 14px;
      color: #cbd5e1;
      margin-top: 14px;
      font-weight: 500;
    }
    .error-box {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      font-size: 13px;
      padding: 14px;
      border-radius: 10px;
      margin-top: 18px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .footer {
      margin-top: 24px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span>🔒</span> 官方只读直连 · 零交易权限
    </div>
    <h1 class="title">欧洲数字银行联合资产核验</h1>
    <p class="subtitle">实时对接持牌银行网关，权威官方数据实时呈现</p>
    
    <div class="bank-tags">
      <span class="tag bunq">bunq</span>
      <span class="tag wise">Wise</span>
      <span class="tag monzo">Monzo</span>
      <span class="tag revolut">Revolut</span>
    </div>

    <div class="spinner-box" id="loader">
      <div class="spinner"></div>
      <div class="status-text" id="status-desc">正在建立安全双向核验通道...</div>
    </div>

    <div class="error-box" id="error-alert">
      <div id="error-msg">核验终端当前处于安全待机状态</div>
      <button class="btn" onclick="checkAndRedirect()">重新检测连接</button>
    </div>
  </div>

  <div class="footer">
    本页面仅限受邀第三方只读核验使用<br>
    数据均由各银行官方 API 实时签名提供
  </div>

  <script>
    async function checkAndRedirect() {
      const loader = document.getElementById("loader");
      const errBox = document.getElementById("error-alert");
      const statusDesc = document.getElementById("status-desc");
      
      loader.style.display = "flex";
      errBox.style.display = "none";
      statusDesc.innerText = "正在同步持牌银行最新核验端点...";

      try {
        const resp = await fetch("./endpoint.json?t=" + Date.now(), { cache: "no-store" });
        if (!resp.ok) throw new Error("无法读取核验配置");
        const data = await resp.json();
        
        if (data && data.target_url) {
          statusDesc.innerText = "端点已就绪，正在安全进入查验系统...";
          setTimeout(() => {
            window.location.replace(data.target_url);
          }, 300);
          return;
        } else {
          throw new Error("核验终端未上报最新链接");
        }
      } catch (err) {
        loader.style.display = "none";
        errBox.style.display = "block";
        document.getElementById("error-msg").innerHTML = "⚠️ <strong>核验服务当前处于待机状态</strong><br>请联系账户持有者开启桌面核验终端后重试。";
      }
    }

    // 页面加载完成后自动执行
    window.addEventListener("DOMContentLoaded", checkAndRedirect);
  </script>
</body>
</html>
